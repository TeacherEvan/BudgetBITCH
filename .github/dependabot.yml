version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    ignore:
      # eslint-plugin-import@2.32.0 requires eslint ^9, but we're on eslint@10
      - dependency-name: "eslint-plugin-import"
        versions: [">=2.32.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    labels:
      - "ci"
      - "automated"
